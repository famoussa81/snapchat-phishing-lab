[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snapchat-phishing-lab"
version = "1.0.0"
description = "Purple Team Phishing Research Lab - Snapchat"
authors = [{name = "Purple Team"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "flask>=2.3.0",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "colorama>=0.4.6",
]
optional-dependencies = {dev = ["pytest>=7.0.0"]}


[tool.setuptools]
packages = []
