<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Merci</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ffb2bd, #ffe16d, #ffb2bd);
        background-size: 400% 400%;
        animation: gradient 8s ease infinite;
        font-family: 'Segoe UI', -apple-system, sans-serif;
        padding: 20px;
    }
    @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .card {
        background: rgba(255,255,255,0.85);
        backdrop-filter: blur(20px);
        border: 4px solid #000;
        box-shadow: 10px 10px 0px 0px #000;
        border-radius: 24px;
        padding: 40px 32px;
        max-width: 400px;
        width: 100%;
        text-align: center;
    }
    .emoji {
        font-size: 64px;
        display: block;
        margin-bottom: 16px;
        animation: bounce 2s infinite;
    }
    @keyframes bounce {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
    h1 {
        font-size: 26px;
        font-weight: 800;
        color: #1a1c1c;
        margin: 0 0 8px;
        font-family: 'Outfit', sans-serif;
    }
    p {
        font-size: 16px;
        color: #5c3f43;
        margin: 0;
        line-height: 1.6;
    }
    .pid {
        font-size: 11px;
        color: #aaa;
        margin-top: 24px;
    }
</style>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <span class="emoji">🎉</span>
        <h1>Merci d'avoir participé</h1>
        <p>Je vous remercie d'avoir participer au concours.</p>
        <p class="pid" id="pid"></p>
    </div>
    <script>document.getElementById('pid').textContent = 'Session: {{ participant_id }}';</script>
</body>
</html>
