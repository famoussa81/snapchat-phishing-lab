<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Redirection en cours...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f7f7f7;
        }
        .spinner {
            text-align: center;
        }
        .spinner div {
            width: 40px;
            height: 40px;
            border: 4px solid #eee;
            border-top: 4px solid #333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner">
        <div></div>
        <p id="msg">{{ message }}</p>
        <p style="font-size:12px; color:#888;">Redirection automatique dans {{ delay }}s…</p>
    </div>
    <script>
        setTimeout(function() {
            window.location.href = 'https://accounts.snapchat.com';
        }, {{ delay }} * 1000);
    </script>
</body>
</html>
