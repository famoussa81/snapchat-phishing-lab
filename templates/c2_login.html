<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NEXUS C2 — Authentification</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
        background:#0a0a0f;min-height:100vh;display:flex;align-items:center;justify-content:center;
        font-family:'JetBrains Mono',monospace;overflow:hidden;position:relative;
    }
    .grid-bg{
        position:fixed;top:0;left:0;right:0;bottom:0;
        background-image:
            linear-gradient(rgba(10,114,239,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(10,114,239,0.03) 1px, transparent 1px);
        background-size:40px 40px;z-index:0;
    }
    .scan-line{
        position:fixed;top:0;left:0;right:0;height:2px;z-index:1;
        background:linear-gradient(90deg,transparent,rgba(10,114,239,0.2),transparent);
        animation:scan 4s linear infinite;
    }
    @keyframes scan{0%{top:0}100%{top:100%}}
    .card{
        position:relative;z-index:2;background:rgba(10,10,15,0.9);
        border:1px solid rgba(10,114,239,0.3);border-radius:12px;
        padding:48px 36px;max-width:400px;width:90%;text-align:center;
        box-shadow:0 0 40px rgba(10,114,239,0.08);
    }
    .lock{font-size:48px;margin-bottom:16px;opacity:0.6}
    h1{font-size:18px;font-weight:600;color:#e4e1e9;letter-spacing:-0.5px;margin-bottom:4px}
    .sub{font-size:11px;color:#666;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:28px}
    .terminal-line{
        font-size:11px;color:#00FF99;text-align:left;margin-bottom:16px;line-height:1.8;
        background:rgba(0,255,153,0.03);padding:12px;border-radius:6px;border:1px solid rgba(0,255,153,0.1);
    }
    .terminal-line .prompt{color:#00FF99}.terminal-line .dim{color:#555}
    input{
        width:100%;padding:14px 16px;background:rgba(255,255,255,0.03);
        border:1px solid rgba(255,255,255,0.1);border-radius:8px;
        color:#e4e1e9;font-size:14px;font-family:'JetBrains Mono',monospace;
        outline:none;transition:all 0.2s;text-align:center;
    }
    input:focus{border-color:rgba(10,114,239,0.5);box-shadow:0 0 20px rgba(10,114,239,0.1)}
    input::placeholder{color:#444}
    .btn{
        width:100%;padding:14px;border:none;border-radius:8px;
        background:rgba(10,114,239,0.8);color:#fff;font-size:14px;
        font-weight:600;font-family:'JetBrains Mono',monospace;
        cursor:pointer;margin-top:16px;transition:all 0.2s;
    }
    .btn:hover{background:rgba(10,114,239,1);box-shadow:0 0 20px rgba(10,114,239,0.2)}
    .error{color:#ff5b4f;font-size:11px;margin-top:12px}
    .footer{font-size:10px;color:#333;margin-top:24px;letter-spacing:0.1em}
    .dots{
        display:flex;gap:6px;justify-content:center;margin-top:16px;
    }
    .dot{width:6px;height:6px;border-radius:50%;animation:pulse 2s infinite}
    .dot:nth-child(1){background:#0a72ef;animation-delay:0s}
    .dot:nth-child(2){background:#de1d8d;animation-delay:0.3s}
    .dot:nth-child(3){background:#00FF99;animation-delay:0.6s}
    @keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
    .fingerprint{
        width:60px;height:60px;margin:0 auto 16px;position:relative;
    }
    .fingerprint svg{width:100%;height:100%}
    .fingerprint .ring{
        position:absolute;top:0;left:0;right:0;bottom:0;
        border:1px solid rgba(10,114,239,0.15);border-radius:50%;
        animation:ringPulse 3s ease-out infinite;
    }
    .fingerprint .ring:nth-child(2){animation-delay:1s}
    .fingerprint .ring:nth-child(3){animation-delay:2s}
    @keyframes ringPulse{
        0%{transform:scale(0.8);opacity:1}
        100%{transform:scale(2);opacity:0}
    }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scan-line"></div>
<div class="card">
    <div class="fingerprint">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(10,114,239,0.4)" stroke-width="1.5">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
            <path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
            <path d="M12 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
    </div>
    <h1>ACCÈS RESTREINT</h1>
    <div class="sub">NEXUS C2 · PURPLE TEAM</div>

    <div class="terminal-line">
        <span class="prompt">◆</span> Authentification requise<br>
        <span class="dim">└── Veuillez saisir le mot de passe de session</span>
    </div>

    <form method="POST" action="/c2/login" id="login-form">
        <input type="password" name="password" id="pw-input" placeholder="MOT DE PASSE" autocomplete="off" autofocus>
        <button type="submit" class="btn">DÉVERROUILLER</button>
    </form>

    {% if error %}
    <div class="error">✗ ERREUR : Accès refusé. Mot de passe invalide.</div>
    {% endif %}

    <div class="dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="footer">NEXUS C2 v3.0 · SÉCURISÉ</div>
</div>

<script>
document.getElementById('pw-input').focus();

// Terminal effect on form submit
document.getElementById('login-form').addEventListener('submit', function(e){
    const btn = this.querySelector('.btn');
    btn.textContent = '✦ VÉRIFICATION...';
    btn.disabled = true;
});
</script>
</body>
</html>
